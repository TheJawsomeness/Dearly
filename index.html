<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <img id="logo" width="200" alt="Website logo">
    <h1>Hi-ah. This is a project! Amazing.</h1>
    Now with npm and Vite!

    <script type="module" src="./js/main.js"></script>
    <hr>
    <h2> Click Counter </h2>
    <p>Count: <span id="counter"> Loading...</span></p>

    <button id="increment-button"> Click me!</button>

    <section id="auth-section">
  <h2>Dearly Account</h2>

  <!-- Sign up -->
  <form id="signup-form" h>
    <h3>Create an account</h3>

    <input
      type="email"
      id="signup-email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      id="signup-password"
      placeholder="Password (at least 6 characters)"
      minlength="6"
      required
    />

    <button type="submit">Sign Up</button>
  </form>

  <!-- Log in -->
  <form id="login-form">
    <h3>Log in</h3>

    <input
      type="email"
      id="login-email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      id="login-password"
      placeholder="Password"
      required
    />

    <button type="submit">Log In</button>
  </form>

  <p id="auth-message"></p>

  <!-- Visible after login -->
  <div id="account-section" hidden>
    <p id="user-email"></p>
    <button id="logout-button">Log Out</button>
  </div>
</section>
</body>
</html>
